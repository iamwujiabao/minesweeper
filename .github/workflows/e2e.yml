# The browser tests (Playwright). Slower than the logic tests, so it only runs when started by hand:
# GitHub > Actions > Browser tests > Run workflow.
name: Browser tests

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results
