<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Minesweeper</title>
<link rel="stylesheet" href="style.css"></head>
<body>
  <h1>Minesweeper</h1>
  <p><small>Plain JavaScript view. <a href="vue.html">Vue version</a> (same game, same ViewModel).</small></p>
  <div id="bar">
    <select id="level"><option value="beginner">Beginner 9x9</option><option value="intermediate">Intermediate 16x16</option><option value="expert">Expert 16x30</option><option value="custom">Custom</option></select>
    <span id="custom" hidden>
      <input id="rows" type="number" min="5" max="30" value="9" title="rows 5-30"> x <input id="cols" type="number" min="5" max="40" value="9" title="columns 5-40"> mines <input id="minesIn" type="number" min="1" value="10" title="mines">
    </span>
    <span>Mines: <b id="mines"></b></span>
    <span>Time: <b id="time">0</b></span>
    <span>Best: <b id="best">-</b></span>
    <button id="new">New Game</button>
    <button id="undo">Undo</button>
    <button id="redo">Redo</button>
    <label><input type="checkbox" id="sound"> Sound</label> <input type="range" id="volume" min="0" max="1" step="0.1" title="volume">
  </div>
  <div id="status"></div><p><small>Touch: long-press to flag. Keyboard keys are listed (and rebindable) below.</small></p>
  <details id="keys"><summary>Keys</summary><div id="keylist"></div><button id="resetkeys">Reset keys</button> <span id="keymsg"></span></details>
  <details id="settings"><summary>Settings export / import</summary>
    <textarea id="settingsText" spellcheck="false" placeholder="Click Export, or paste exported settings here and click Import"></textarea><br>
    <button id="export">Export</button> <button id="import">Import</button> <span id="settingsMsg"></span>
  </details><br>
  <div id="board"></div>
  <script src="src/game.js"></script>
  <script src="src/viewmodel.js"></script>
  <script src="src/sound.js"></script>
  <script src="src/app.js"></script>
</body></html>
