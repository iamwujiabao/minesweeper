<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Minesweeper</title>
<style>
  body { font-family: sans-serif; text-align: center; background: #eee; }
  #bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; align-items: center; margin: 12px; }
  #board { display: inline-grid; grid-template-columns: repeat(var(--cols), var(--s)); gap: 2px; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
  #board button { width: var(--s); height: var(--s); font-size: calc(var(--s) / 2); font-weight: bold; padding: 0; cursor: pointer; }
  #custom input { width: 52px; }
  #board button.open { background: #ddd; cursor: default; }
  #board button.boom { background: #f66; }
  #board button.cursor { outline: 3px solid #08f; outline-offset: -3px; }
  .n1{color:#00f}.n2{color:#080}.n3{color:#f00}.n4{color:#008}.n5{color:#800}.n6{color:#088}.n7{color:#000}.n8{color:#666}
</style></head>
<body>
  <h1>Minesweeper</h1>
  <div id="bar">
    <select id="level"><option value="beginner">Beginner 9x9</option><option value="intermediate">Intermediate 16x16</option><option value="expert">Expert 16x30</option><option value="custom">Custom</option></select>
    <span id="custom" hidden>
      <input id="rows" type="number" min="5" max="30" value="9" title="rows 5-30"> x <input id="cols" type="number" min="5" max="40" value="9" title="columns 5-40"> mines <input id="minesIn" type="number" min="1" value="10" title="mines">
    </span>
    <span>Mines: <b id="mines"></b></span>
    <span>Time: <b id="time">0</b></span>
    <span>Best: <b id="best">-</b></span>
    <button id="new">New Game</button>
    <button id="undo">Undo</button>
    <button id="redo">Redo</button>
    <label><input type="checkbox" id="sound" checked> Sound</label>
  </div>
  <div id="status"></div><p><small>Touch: long-press to flag. Keyboard: arrows move, Enter/Space reveal or chord, F flag, U undo, Y redo, N new game.</small></p>
  <div id="board"></div>
  <script src="src/game.js"></script>
  <script src="src/viewmodel.js"></script>
  <script src="src/app.js"></script>
</body></html>
